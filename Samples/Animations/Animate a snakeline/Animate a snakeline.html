<!DOCTYPE html>
<html lang="en">
<head>
    <title>51 Shaktipeethas - Azure Maps Animation</title>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Azure Maps SDK -->
    <link href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" rel="stylesheet" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>

    <!-- Azure Maps Animation module -->
    <script src="https://microsoft.github.io/AzureMapsCodeSamples/Common/scripts/azure-maps-animations.min.js"></script>

    <script>
        var map, line, animation, datasource;

        // Coordinates of 51 Shaktipeethas (sample lat/longs, approx for demo)
        var shaktipeethas = [
            { name: "Kamakhya Devi, Assam", coords: [91.7372, 26.1648] },
            { name: "Jwalamukhi, Himachal Pradesh", coords: [76.3225, 31.8744] },
            { name: "Naina Devi, Himachal Pradesh", coords: [76.5420, 31.2453] },
            { name: "Vishalakshi Gauri, Varanasi", coords: [83.0066, 25.3176] },
            { name: "Kalighat Kali, Kolkata", coords: [88.3426, 22.5186] },
            { name: "Kankalitala, Birbhum", coords: [87.6942, 23.9179] },
            { name: "Tara Tarini, Odisha", coords: [84.7880, 19.3880] },
            { name: "Hinglaj Mata, Pakistan", coords: [65.5140, 25.5120] },
            { name: "Vaishno Devi, J&K", coords: [74.9490, 33.0300] },
            { name: "Shankari Devi, Lanka", coords: [80.6350, 7.2906] },
            // 🔽 Add remaining Shaktipeetha coords similarly (total 51 needed)
            // For demo purpose only 10 added here
        ];

        // Create a path by extracting coordinates from Shaktipeethas
        var path = shaktipeethas.map(s => s.coords);

        function getMap() {
            map = new atlas.Map('myMap', {
                center: [82.9739, 23.5937], // Center of India
                zoom: 4.5,
                view: 'Auto',
                authOptions: {
                    authType: 'subscriptionKey',
                    subscriptionKey: '[YOUR_AZURE_MAPS_KEY]'
                }
            });

            map.events.add('ready', function () {
                datasource = new atlas.source.DataSource();
                map.sources.add(datasource);

                // Create line shape
                line = new atlas.Shape(new atlas.data.LineString(path));
                datasource.add(line);

                // Line layer
                map.layers.add(new atlas.layer.LineLayer(datasource, null, {
                    strokeColor: 'red',
                    strokeWidth: 3
                }));

                // Add Shaktipeetha pins
                shaktipeethas.forEach(function (s) {
                    datasource.add(new atlas.data.Feature(new atlas.data.Point(s.coords), {
                        title: s.name
                    }));
                });

                // Add pin layer with labels
                map.layers.add(new atlas.layer.SymbolLayer(datasource, null, {
                    iconOptions: {
                        image: 'pin-round-red',
                        allowOverlap: true
                    },
                    textOptions: {
                        textField: ['get', 'title'],
                        offset: [0, 1.2],
                        color: '#000',
                        size: 12
                    }
                }));
            });

            // Animate on click
            map.events.add('click', function () {
                if (animation) {
                    animation.stop();
                    animation.play();
                } else {
                    animation = atlas.animations.snakeline(line, {
                        duration: 5000,
                        easing: 'linear',
                        autoPlay: true
                    });
                }
            });
        }
    </script>
</head>
<body onload="getMap()">
    <div id="myMap" style="position:relative;width:100%;height:600px;"></div>
    <div style="position:absolute;top:0;left:calc(50% - 120px);background:white;padding:6px;">
        Click map to animate 51 Shaktipeethas line.
    </div>
</body>
</html>
